services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: medservice_frontend
    restart: unless-stopped
    expose:
      - "3000"

  # Patient mini-app (Vite SPA). Builds dist/ and serves it via an internal
  # Caddy that does SPA-fallback and proxies /api/* to the backend, so the mini
  # uses a same-origin (CORS-free) API. The edge Caddy reverse-proxies the mini
  # domain here. Without this service, every patient SMS review link 404s.
  mini:
    build:
      context: ../medservice-mini
      dockerfile: Dockerfile
    image: medservice-mini:prod
    container_name: medservice_mini
    restart: unless-stopped
    environment:
      BACKEND_PRIVATE_HOST: ${BACKEND_PRIVATE_HOST}
      BACKEND_PRIVATE_PORT: ${BACKEND_PRIVATE_PORT}
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: medservice_caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - mini
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      MINI_DOMAIN: ${MINI_DOMAIN}
      BACKEND_PRIVATE_HOST: ${BACKEND_PRIVATE_HOST}
      BACKEND_PRIVATE_PORT: ${BACKEND_PRIVATE_PORT}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
    name: medservice_caddy_data
  caddy_config:
    name: medservice_caddy_config
